// Tiered testing tasks for SmilePile
// Phase 5 Implementation - ATLAS-TEST-001
// Atlas Standard Workflow
//
// Creates flavor-specific test tasks for each build variant (qual, stage, beta, prod)
// matching the 4-tier build system from StackMap

// Helper to create tier test tasks for each flavor
['Qual', 'Stage', 'Beta', 'Prod'].each { flavor ->
    def flavorLower = flavor.toLowerCase()

    // Tier 1: Critical Tests (Security, Data Integrity)
    tasks.register("test${flavor}ReleaseTier1Critical") {
        description = "Run Tier 1 Critical Tests for ${flavor} (Security, Data Integrity)"
        group = 'verification'

        doFirst {
            println ""
            println "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
